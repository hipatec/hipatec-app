<app-modal-shell [titulo]="post ? 'Editar publicação' : 'Criar publicação'" (fechar)="fechar()">
  <div class="post-input-area">
    <app-avatar class="post-avatar" [src]="pfp" [nome]="nome" />
    <textarea id="publicacao-conteudo" maxlength="5000" name="conteudo" [disabled]="isSubmitting" [(ngModel)]="conteudo" (ngModelChange)="atualizarAlterado()" [attr.aria-invalid]="erroConteudo ? true : null" aria-describedby="publicacao-conteudo-erro" aria-label="Conteúdo da publicação" placeholder="Digite aqui…" rows="6"></textarea>
  </div>

  <p class="hipatec-state-error" id="publicacao-conteudo-erro" role="alert" *ngIf="erroConteudo">{{ erroConteudo }}</p>
  <p class="hipatec-state hipatec-state-error" role="alert" *ngIf="erro">{{ erro }}</p>
  <div modalFooter class="post-actions-footer">
    <label *ngIf="!post" class="image-picker">Imagem (PNG ou JPEG, até 5 MB)
      <input type="file" accept="image/png,image/jpeg" [disabled]="isSubmitting" (change)="selecionarImagem($event)" />
    </label>
    <button type="button" class="btn-submit-post hipatec-btn-primary" (click)="postar()" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Postando…' : 'Postar' }}
    </button>
  </div>
</app-modal-shell>
