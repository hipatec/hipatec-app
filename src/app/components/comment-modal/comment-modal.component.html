<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="fechar()">
        <ion-icon [icon]="iconeFechar"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="draft-title">Responder</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="replying-to">
    Respondendo a <span>{{ getArroba() }}</span>
  </div>

  <div class="post-preview" *ngIf="postSelecionado">
    <div class="post-preview-avatar">
      <img *ngIf="autorFoto" [src]="autorFoto" [alt]="autorNome" />
      <span *ngIf="!autorFoto">{{ iniciais(autorNome) }}</span>
    </div>
    <div class="post-preview-content">
      <strong>{{ autorNome }}</strong>
      <p>{{ textoPost }}</p>
    </div>
  </div>

  <div class="comments-list" *ngIf="!carregando && comentarios.length > 0">
    <article class="comment-item" *ngFor="let comentario of comentarios">
      <div class="comment-avatar">
        <img *ngIf="comentario.autorFoto" [src]="comentario.autorFoto" [alt]="comentario.autorNome || 'Usuário'" />
        <span *ngIf="!comentario.autorFoto">{{ iniciais(comentario.autorNome) }}</span>
      </div>
      <div class="comment-copy">
        <strong>{{ comentario.autorNome }}</strong>
        <p>{{ comentario.texto }}</p>
      </div>
    </article>
  </div>
  <p class="comments-state" *ngIf="carregando">Carregando comentários...</p>
  <p class="comments-state" *ngIf="!carregando && comentarios.length === 0">Ainda não há comentários.</p>

  <div class="post-input-area">
    <div class="post-avatar"></div>
    <textarea [(ngModel)]="texto" placeholder="Escreva um comentário..." rows="4" maxlength="500"></textarea>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <ion-toolbar>
    <div class="post-actions-footer">
      <div class="icons-group">
        <ion-button fill="clear" class="icon-btn" aria-label="Adicionar imagem">
          <ion-icon [icon]="iconeImagem"></ion-icon>
        </ion-button>
      </div>
      <button class="btn-submit-post" type="button" [disabled]="enviando || !texto.trim()" (click)="enviar()">
        {{ enviando ? 'Enviando...' : 'Responder' }}
      </button>
    </div>
  </ion-toolbar>
</ion-footer>
