<div class="gradient-bg">
  
  <div class="container">
    <a class="logo-box logo-link" routerLink="/" aria-label="Voltar para a página inicial da Hipatec">
        <img src="assets/logo_hipatec_roxo.png" alt="Hipatec" class="logo-img" />
    </a>
    <main>

      

      <h2 class="login-title">{{ role === 'estudantes' ? 'Login Estudante' : 'Login Mentora' }}</h2>

      <form #loginForm="ngForm" (ngSubmit)="login()">
        <ion-segment class="role-toggle" [value]="role" (ionChange)="switchRole($event)">
          <ion-segment-button value="estudantes">
            <ion-label>Estudante</ion-label>
          </ion-segment-button>
          <ion-segment-button value="mentoras">
            <ion-label>Mentora</ion-label>
          </ion-segment-button>
        </ion-segment>

        <div class="input-group">
          <label for="login-identifier">E-mail ou usuário</label>
          <input id="login-identifier" name="identificador" type="text" [(ngModel)]="email" placeholder="Digite seu e-mail ou usuário" autocomplete="username" required />
          <small class="field-hint">Use o e-mail ou o nome de usuário do cadastro.</small>
        </div>

        <div class="input-group">
          <label for="login-password">Senha</label>
          <input id="login-password" name="senha" type="password" [(ngModel)]="password" placeholder="Digite sua senha" autocomplete="current-password" required />
        </div>

        <button class="btn-login" type="submit">Fazer login</button>
      </form>

      <div class="login-footer-links">
        <a class="footer-link" routerLink="/forgot-password">Esqueceu sua senha?</a>
        <a class="footer-link" routerLink="/cadastro">Não possui cadastro?</a>

      </div>

    </main>

  </div>
</div>
