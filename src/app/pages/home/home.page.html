
<ion-content>
<app-feedback-notice [mensagem]="aviso" />
  <div class="gradient-bg">
    <div class="main-layout-wrapper">
      
      <div class="main-layout">
        
        <div class="feed-column">
          <div class="feed-container">
            <div class="hipatec-state" *ngIf="carregando" role="status" aria-live="polite">
              Carregando publicações...
            </div>

            <div class="hipatec-state hipatec-state-error" *ngIf="erroFeed" role="alert">
              {{ erroFeed }}
              <button type="button" class="hipatec-state-retry" (click)="buscarPosts()">Tentar novamente</button>
            </div>

            <div class="hipatec-state" *ngIf="!carregando && !erroFeed && posts.length === 0">
              Nenhuma publicação ainda.
            </div>

            <div class="post-card" *ngFor="let post of posts" role="article" tabindex="0" (click)="abrirPublicacao(post, $event)" (keydown.enter)="abrirPublicacao(post, $event)">
              <app-post-author-header class="post-header" [autor]="post.autor" [avatar]="post.avatar" [tempo]="post.tempo" (autorClick)="abrirPerfil(post)">
                <button type="button" role="menuitem" class="hipatec-menu-item" *ngIf="canEditPost(post)" (click)="editarPost(post)">
                  <ion-icon name="pencil" aria-hidden="true"></ion-icon>
                  <span>Editar publicação</span>
                </button>
                <button type="button" role="menuitem" class="hipatec-menu-item hipatec-menu-item-danger" *ngIf="canDeletePost(post)" (click)="excluirPost(post)">
                  <ion-icon name="trash" aria-hidden="true"></ion-icon>
                  <span>Excluir publicação</span>
                </button>
                <button type="button" role="menuitem" class="hipatec-menu-item" (click)="abrirDenuncia(post)">
                  <ion-icon name="flag-outline" aria-hidden="true"></ion-icon>
                  <span>Denunciar publicação</span>
                </button>
              </app-post-author-header>

              <div class="post-body">
                <app-post-content [post]="post" />
              </div>

              <p *ngIf="post.erroInteracao" role="alert" class="hipatec-state-error">{{ post.erroInteracao }}</p>
          <app-post-actions [post]="post" (recuperar)="recuperarInteracoes(post)"
                (curtir)="toggleCurtida(post)"
                (comentar)="abrirModalComentario(post)"
                (repostar)="repostar(post)"
                (repostarComComentario)="repostar(post, true)" />


            </div>

          </div>
        </div>

        <aside class="sidebar-column" aria-label="Sugestões de perfis">
          <div class="sidebar-card" *ngIf="sugestoesExibidas.length > 0">
            <h3>Quem seguir</h3>
            
            <ul class="sidebar-list">
              <li class="sidebar-item" *ngFor="let sugestao of sugestoesExibidas">
                <button type="button" class="item-link" [attr.aria-label]="'Abrir perfil de ' + sugestao.nome" (click)="abrirSugestao(sugestao)">
                  <app-avatar class="item-avatar" [src]="sugestao.pfp" [nome]="sugestao.nome" />
                  <span class="item-info">
                    <span class="item-name">{{ sugestao.nome }}</span>
                    <span class="item-handle" *ngIf="sugestao.arroba">{{ sugestao.arroba }}</span>
                  </span>
                </button>
                <button *ngIf="sessaoAutenticada" type="button" class="btn-follow"
                  [class.following]="sugestao.seguindo === true"
                  [attr.aria-disabled]="sugestao.pendente ? 'true' : null"
                  [attr.aria-busy]="sugestao.pendente ? 'true' : null"
                  [attr.aria-describedby]="sugestao.erro ? 'seguir-erro-' + sugestao.perfilId : null"
                  (click)="alternarSeguimento(sugestao)">
                  {{ sugestao.seguindo === null ? 'Verificar' : (sugestao.seguindo ? 'Seguindo' : 'Seguir') }}<span class="hipatec-visually-hidden">{{ sugestao.seguindo === null ? ' status de ' : ' ' }}{{ sugestao.nome }}</span>
                </button>
                <p class="item-error" role="alert" *ngIf="sugestao.erro" [id]="'seguir-erro-' + sugestao.perfilId">{{ sugestao.erro }}</p>
              </li>
            </ul>
            <p class="hipatec-visually-hidden" role="status" aria-live="polite">{{ anuncioSeguimento }}</p>

            <div class="sidebar-more" *ngIf="quantidadeSugestoes < sugestoes.length">
              <button type="button" class="sidebar-more-button" (click)="mostrarMaisSugestoes()">Mostrar mais</button>
            </div>
          </div>
          <div class="sidebar-card hipatec-state" *ngIf="sugestoesExibidas.length === 0">
            Sugestões de pessoas aparecerão quando essa função estiver conectada à API.
          </div>
        </aside>

      </div>

    </div>
  </div>
  <button type="button" class="create-post-button home-create-post" aria-label="Criar publicação" (click)="abrirModalPost()">+</button>
</ion-content>
