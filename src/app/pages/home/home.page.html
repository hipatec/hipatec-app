
<ion-content>
  <div class="gradient-bg">
    <div class="main-layout-wrapper">
      
      <div class="main-layout">
        
        <div class="feed-column">
          <div class="feed-container">
            <div class="feed-state" *ngIf="carregando" role="status" aria-live="polite">
              Carregando publicações...
            </div>

            <div class="feed-state feed-state-error" *ngIf="erroFeed" role="alert">
              {{ erroFeed }}
              <button type="button" class="feed-retry" (click)="buscarPosts()">Tentar novamente</button>
            </div>

            <div class="feed-state" *ngIf="!carregando && !erroFeed && posts.length === 0">
              Nenhuma publicação ainda.
            </div>

            <div class="post-card" *ngFor="let post of posts">
              <div class="post-header">
                <div class="post-avatar-placeholder">
                  <img [src]="post.avatar" [alt]="post.autor" />
                </div>
                <div class="post-meta">
                  <span class="post-author">{{ post.autor }}</span>
                  <!-- <span class="post-role">{{ post.role }}</span> -->
                </div>
                <span class="post-time">{{ post.tempo }}</span>
                <button type="button" class="btn-options" [attr.aria-label]="'Mais opções da publicação de ' + post.autor" (click)="togglePostMenu(post)">
                  <ion-icon name="ellipsis-horizontal" aria-hidden="true"></ion-icon>
                </button>
                <div class="post-menu" *ngIf="postMenuId === post.id" role="menu">
                  <button type="button" role="menuitem" *ngIf="canEditPost(post)" (click)="editarPost(post)">
                    <ion-icon name="pencil" aria-hidden="true"></ion-icon>
                    <span>Editar publicação</span>
                  </button>
                  <button type="button" role="menuitem" class="post-menu-danger" *ngIf="canDeletePost(post)" (click)="excluirPost(post)">
                    <ion-icon name="trash" aria-hidden="true"></ion-icon>
                    <span>Excluir publicação</span>
                  </button>
                  <button type="button" role="menuitem" (click)="abrirDenuncia(post)">
                    <ion-icon name="flag-outline" aria-hidden="true"></ion-icon>
                    <span>Denunciar publicação</span>
                  </button>
                </div>
              </div>

              <div class="post-body">
                <p class="post-text">{{ post.conteudo }}</p>
              </div>

              <div class="post-actions">
                <button 
                  type="button"
                  class="action-btn btn-like" 
                  [attr.aria-label]="(post.curtidoUsuario ? 'Descurtir' : 'Curtir') + ' publicação de ' + post.autor"
                  [class.active-like]="post.curtidoUsuario" 
                  (click)="toggleCurtida(post)">
                    
                  <ion-icon [icon]="post.curtidoUsuario ? iconeCurtido : iconeCurtir"></ion-icon>
                    
                  <span class="action-count">{{ post.curtidas }}</span>
                </button>
                <button type="button" class="action-btn btn-comment" [attr.aria-label]="'Comentar publicação de ' + post.autor" (click)="abrirModalComentario(post)">
                  <ion-icon [icon]="iconeComentar"></ion-icon>
                  <span class="action-count">{{ post.comentarios }}</span>
                </button>
                <button type="button" class="action-btn btn-repost" [class.active-repost]="post.repostadoUsuario" aria-label="Repostar publicação" (click)="repostar(post)">
                  <ion-icon name="repeat-outline" aria-hidden="true"></ion-icon>
                  <span class="action-count">{{ post.reposts }}</span>
                </button>
                <button type="button" class="action-btn btn-repost-comment" [class.active-repost]="post.repostadoUsuario" aria-label="Repostar com comentário" (click)="repostar(post, true)">
                  <ion-icon name="repeat-outline" aria-hidden="true"></ion-icon>
                  <span>Comentar</span>
                </button>
              </div>

              <div class="report-dialog-backdrop" *ngIf="postEmDenuncia?.id === post.id" role="presentation">
                <section class="report-dialog" role="dialog" aria-modal="true" aria-labelledby="report-title">
                  <div class="report-dialog-header">
                    <div>
                      <span class="report-kicker">MODERAÇÃO</span>
                      <h3 id="report-title">Denunciar publicação</h3>
                    </div>
                    <button type="button" class="report-close" aria-label="Fechar denúncia" (click)="fecharDenuncia()">
                      <ion-icon name="close" aria-hidden="true"></ion-icon>
                    </button>
                  </div>
                  <p>Conte-nos o que há de errado. A equipe poderá analisar o conteúdo.</p>
                  <label for="report-reason">Motivo da denúncia</label>
                  <select id="report-reason" [(ngModel)]="motivoDenuncia">
                    <option value="">Selecione um motivo</option>
                    <option value="assédio">Assédio ou ataque</option>
                    <option value="discurso-odioso">Discurso de ódio</option>
                    <option value="spam">Spam ou fraude</option>
                    <option value="conteudo-inadequado">Conteúdo inadequado</option>
                  </select>
                  <div class="report-dialog-actions">
                    <button type="button" class="report-cancel" (click)="fecharDenuncia()">Cancelar</button>
                    <button type="button" class="report-submit" (click)="enviarDenuncia()">Enviar denúncia</button>
                  </div>
                </section>
              </div>
            </div>

          </div>
        </div>

        <div class="sidebar-column">
          <div class="sidebar-card">
            <h3>Quem seguir</h3>
            
            <div class="sidebar-item" *ngFor="let sugestao of sugestoesExibidas">
              <div class="item-avatar"></div>
              <div class="item-info">
                <span class="item-name">{{ sugestao.nome }}</span>
                <span class="item-handle">{{ sugestao.arroba }}</span>
              </div>
              <button class="btn-follow">Seguir</button>
            </div>

            <div class="sidebar-more" *ngIf="quantidadeSugestoes < sugestoes.length">
              <button type="button" class="sidebar-more-button" (click)="mostrarMaisSugestoes()">Mostrar mais</button>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" class="fab-post">
    <ion-fab-button (click)="abrirModalPost()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
